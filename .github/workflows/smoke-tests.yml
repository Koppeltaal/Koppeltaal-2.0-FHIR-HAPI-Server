# Builds the image of this checkout, starts it with docker-compose on a fresh database with security enabled,
# and checks that it starts and answers like it should. See e2e/smoke.sh.

name: Smoke Tests

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "charts/**"

jobs:
  smoke_test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Start the server and run the smoke checks
        run: ./e2e/smoke.sh
